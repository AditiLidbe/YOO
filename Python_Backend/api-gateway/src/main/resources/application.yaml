spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**
          - id: python-jobs
            uri: http://localhost:8000
            predicates:
              - Path=/api/jobs/**
            filters:
              - StripPrefix=1
          - id: python-applications
            uri: http://localhost:8000
            predicates:
              - Path=/api/applications/**,/api/candidates/**,/api/recruiters/**
            filters:
              - StripPrefix=1
          - id: python-ai
            uri: http://localhost:8000
            predicates:
              - Path=/api/ai/**
            filters:
              - StripPrefix=1
        globalcors:
          cors-configurations:
            '[/**]':
              allowed-origins: "http://localhost:5173"
              allowed-methods: "*"
              allowed-headers: "*"
              allow-credentials: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework: INFO
    com.talenta: DEBUG
